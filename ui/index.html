<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ProveIt</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/vendor/noto-sans-sc/index.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar">
        <a class="brand" href="/"
          >P<span>ProveIt<small data-i18n="tagline"></small></span></a
        ><button class="primary" id="new-chat" data-i18n="newChat"></button
        ><input
          id="search"
          type="search"
          data-i18n-placeholder="search"
          data-i18n-label="search"
        />
        <div class="section-title">
          <span data-i18n="projects"></span
          ><button id="new-project" data-i18n-label="newProject">＋</button>
        </div>
        <nav id="project-list"></nav>
        <footer>
          <button id="environments" data-i18n="manageEnvironments"></button><button id="trash" data-i18n="trash"></button
          ><button id="settings" data-i18n="settings"></button
          ><button id="connection-status" class="connection-status" data-i18n="connectionOffline"></button><small data-i18n="local"></small>
        </footer>
      </aside>
      <button id="scrim" data-i18n-label="closeSidebar"></button>
      <main>
        <header>
          <button id="toggle-sidebar" data-i18n-label="toggleSidebar">
            ☰
          </button>
          <div class="heading">
            <small id="breadcrumb"></small><strong id="title">ProveIt</strong>
          </div>
          <span id="save-state"></span>
          <details id="actions">
            <summary data-i18n-label="more">•••</summary>
            <div class="menu" id="action-menu"></div>
          </details>
        </header>
        <div class="tabbar" role="tablist">
          <button
            role="tab"
            data-view="conversation"
            data-i18n="conversation"
          ></button
          ><button role="tab" data-view="document" data-i18n="document"></button
          ><button role="tab" data-view="lean" data-i18n="lean"></button
          ><span id="run-state" role="status"></span>
        </div>
        <div id="environment-notice" hidden><span data-i18n="environmentMissingHint"></span><button id="environment-notice-open" data-i18n="environmentOpen"></button></div><div id="content"></div>
        <section id="composer">
          <textarea
            id="prompt"
            rows="2"
            data-i18n-placeholder="composerPlaceholder"
            data-i18n-label="composerPlaceholder"
          ></textarea>
          <div>
            <div class="model-controls">
              <select id="model-select" aria-label="Model"></select
              ><select id="effort-select" aria-label="Reasoning effort"></select
              ><button id="model-retry" hidden type="button">↻</button>
            </div>
            <small data-i18n="composerHint"></small
            ><button id="pause" data-i18n="pause"></button
            ><button id="send" class="primary" data-i18n="send"></button>
          </div>
          <p class="boundary" data-i18n="boundary"></p>
        </section>
      </main>
    </div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status"></div>
    <script src="/vendor/katex/katex.min.js"></script>
    <script type="module" src="/js/markdown.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
